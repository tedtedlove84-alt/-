  <rect x="65" y="45" width="38" height="38" rx="13" fill="#ff385c"/>
  <path d="M76 72V57h16v15M80 72v-8h8v8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
