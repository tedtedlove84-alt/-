      <g class="small muted"><text x="12" y="20">9 일</text><text x="124" y="20">10 월</text><text x="236" y="20">11 화</text><text x="348" y="20">12 수</text><text x="460" y="20">13 목</text><text x="572" y="20">14 금</text><text x="684" y="20">15 토</text><text x="796" y="20">16 일</text><text x="908" y="20">17 월</text></g>
