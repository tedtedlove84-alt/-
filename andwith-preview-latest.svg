    <line x1="24" y1="214" x2="736" y2="214" stroke="#ededed"/>
    <circle cx="38" cy="238" r="15" fill="#315f50"/><text x="33" y="244" class="label white">3</text><text x="68" y="235" class="label">첫 5장 사진 정보 입력 대기</text><text x="388" y="235" class="small muted">자료가 없어 변경보다 관찰 유지</text><text x="628" y="240" class="small coral">리스팅 점검 →</text>
  </g>

