      .muted{fill:#717171}.coral{fill:#ff385c}.green{fill:#315f50}.brown{fill:#966126}.white{fill:#fff}
      .eyebrow{font-size:13px;font-weight:800;letter-spacing:1.5px}.label{font-size:14px;font-weight:650}.small{font-size:12px}.body{font-size:14px}.h1{font-size:36px;font-weight:800}.h2{font-size:20px;font-weight:800}.metric{font-size:29px;font-weight:800}.nav{font-size:14px;font-weight:700}
    </style>
